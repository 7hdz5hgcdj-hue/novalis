<style id="css">
:root{--accent:#d62828;--bg:#f2f4f8;--surface:#fff;--text:#14213d;--muted:#55607a;--border:#d5dae6;--hero:#e4e9f5;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0b1120;--surface:#141c30;--text:#e8edf7;--muted:#9aa6c0;--border:#24304d;--hero:#0e1730}}
:root[data-theme="dark"]{--bg:#0b1120;--surface:#141c30;--text:#e8edf7;--muted:#9aa6c0;--border:#24304d;--hero:#0e1730}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--text);font:16.5px/1.6 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
body.edit{padding-bottom:150px}
h1,h2,h3{line-height:1.2;margin:0 0 .5em;font-weight:800}
p{margin:0 0 .6em;white-space:pre-line}
a{color:inherit}
nav{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:10px;padding:14px 20px;border-bottom:1px solid var(--border);background:var(--surface);border-top:5px solid var(--accent)}
nav b{font-size:1.15rem}
nav div{display:flex;gap:6px;flex-wrap:wrap}
.pg{background:none;border:0;color:var(--muted);font:inherit;padding:6px 12px;border-radius:99px;cursor:pointer}
.pg.on{background:var(--accent);color:#fff}
main{max-width:860px;margin:0 auto;padding:20px}
.b{position:relative;margin:0 0 18px;border-radius:10px}
.edit .b{outline:1px dashed var(--border);padding:8px}
.hero{text-align:center;background:var(--hero);border-radius:14px;padding:48px 20px}
.hero h1{font-size:clamp(2rem,8vw,3.6rem)}
.hero p{color:var(--muted);max-width:560px;margin:0 auto 20px}
.btn{display:inline-block;background:var(--accent);color:#fff;padding:12px 26px;border-radius:8px;text-decoration:none;font-weight:700}
.button,.link{text-align:center}
.link a{color:var(--accent);font-weight:600}
.heading h2{text-align:center;font-size:1.8rem;margin-top:24px}
.card{background:var(--surface);border:1px solid var(--border);border-left:5px solid var(--accent);padding:18px 20px}
.card p{color:var(--muted);margin:0}
.image img,.video video{max-width:100%;border-radius:10px;display:block;margin:0 auto}
.audio{background:var(--surface);border:1px solid var(--border);padding:14px 18px}
.audio audio{width:100%;margin-top:6px}
.ph{color:var(--muted);text-align:center;padding:24px;border:1px dashed var(--border);border-radius:10px}
footer{text-align:center;color:var(--muted);font-size:.85rem;padding:24px 20px;border-top:1px solid var(--border)}
.tb{position:absolute;top:-14px;right:6px;display:flex;gap:2px;background:var(--surface);border:1px solid var(--border);border-radius:8px;padding:2px;z-index:2}
.tb button,.x{background:none;border:0;color:var(--text);font-size:1rem;padding:4px 8px;cursor:pointer}
.add{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin-top:24px}
select,input,textarea{font:inherit;color:var(--text);background:var(--bg);border:1px solid var(--border);border-radius:8px;padding:9px 10px;width:100%}
.add select{width:auto}
.ab{background:var(--accent);color:#fff;border:0;border-radius:8px;padding:10px 16px;font:inherit;font-weight:700;cursor:pointer}
.ab.g{background:var(--surface);color:var(--text);border:1px solid var(--border)}
#fab{position:fixed;right:16px;bottom:calc(16px + env(safe-area-inset-bottom,0px));width:54px;height:54px;border-radius:50%;border:0;background:var(--accent);color:#fff;font-size:1.4rem;box-shadow:0 4px 14px #0005;cursor:pointer;z-index:20}
#bar{position:fixed;left:0;right:0;bottom:0;display:flex;gap:8px;justify-content:center;flex-wrap:wrap;background:var(--surface);border-top:1px solid var(--border);padding:10px 10px calc(10px + env(safe-area-inset-bottom,0px));z-index:20}
#panel{position:fixed;left:0;right:0;bottom:0;max-height:72vh;overflow:auto;background:var(--surface);border-top:3px solid var(--accent);border-radius:16px 16px 0 0;padding:16px 18px calc(18px + env(safe-area-inset-bottom,0px));z-index:30;box-shadow:0 -6px 24px #0006}
#panel[hidden],#bar[hidden],#fab[hidden]{display:none}
#panel h3{display:flex;justify-content:space-between;align-items:center}
#panel label{display:block;font-size:.85rem;color:var(--muted);margin:12px 0 4px}
#panel h4{margin:18px 0 0;color:var(--accent)}
#panel input[type=checkbox]{width:auto}
#panel input[type=color]{height:42px;padding:2px}
#panel textarea{min-height:90px}
#loader{position:fixed;inset:0;background:var(--bg);display:grid;place-content:center;justify-items:center;gap:18px;z-index:99;transition:opacity .5s,visibility .5s}
#loader.gone{opacity:0;visibility:hidden}
.spin{width:46px;height:46px;border:5px solid var(--border);border-top-color:var(--accent);border-radius:50%;animation:r .9s linear infinite}
@keyframes r{to{transform:rotate(360deg)}}
#toast{position:fixed;left:50%;top:calc(14px + env(safe-area-inset-top,0px));transform:translateX(-50%);background:var(--text);color:var(--bg);padding:10px 16px;border-radius:8px;z-index:100;font-size:.9rem}
.in[style*="background"]{padding:14px;border-radius:10px}
.in{border-radius:inherit}
.section{background:var(--accent);color:#fff;padding:36px 20px;border-radius:14px;text-align:center}
.section .btn{background:#fff;color:#111}
.shp{max-width:100%}
.cd{font-size:2.2rem;font-weight:800;color:var(--accent);font-variant-numeric:tabular-nums}
.count{text-align:center}
.sr{display:flex;gap:8px}.sr input{flex:1}
.search a{color:var(--accent)}
@keyframes fi{from{opacity:0}}@keyframes su{from{opacity:0;transform:translateY(24px)}}
@keyframes bo{50%{transform:translateY(-14px)}}@keyframes pu{50%{transform:scale(1.07)}}
@keyframes sh{25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}@keyframes sp{to{transform:rotate(360deg)}}
@keyframes rb{to{filter:hue-rotate(360deg)}}@keyframes gl{50%{text-shadow:0 0 12px var(--accent),0 0 26px var(--accent)}}
.an-fi{animation:fi 1s both}.an-su{animation:su .8s both}.an-bo{animation:bo 1.2s infinite}.an-pu{animation:pu 1.4s infinite}.an-sh{animation:sh .5s infinite}.an-sp{animation:sp 4s linear infinite}.an-rb{animation:rb 4s linear infinite}.an-gl{animation:gl 1.6s infinite}
@media (prefers-reduced-motion:reduce){[class*=an-]{animation:none}}
.burger{background:none;border:0;color:var(--text);font-size:1.7rem;line-height:1;cursor:pointer;padding:2px 8px}
nav{flex-wrap:nowrap}
#menu{position:fixed;top:0;bottom:0;right:0;width:min(290px,82vw);background:var(--surface);border-left:3px solid var(--accent);padding:calc(18px + env(safe-area-inset-top,0px)) 14px 18px;transform:translateX(105%);transition:transform .25s;z-index:40;overflow:auto}
.mo #menu{transform:none}
#scrim{position:fixed;inset:0;background:#0007;display:none;z-index:35}.mo #scrim{display:block}
#menu .pg{display:block;width:100%;text-align:left;padding:12px 14px;margin:3px 0;font-size:1rem;border-radius:10px}
#menu .btn{display:block;text-align:center;margin-top:18px}
.don{text-align:center;background:linear-gradient(135deg,var(--accent),#7c3aed);color:#fff;padding:30px 18px;border-radius:14px}
.don .btn{background:#fff;color:#111}
.am{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin:10px 0 14px}
.chip{border:2px solid #fff;color:#fff;padding:6px 16px;border-radius:99px;text-decoration:none;font-weight:700}
button.chip{background:none;font:inherit;cursor:pointer}
.dlg{position:fixed;inset:0;background:#000a;display:grid;place-items:center;z-index:60}
.dlg>div{background:var(--surface);color:var(--text);padding:24px;border-radius:14px;max-width:340px;width:90%;text-align:center}
.dlg b{font-size:1.7rem;color:var(--accent);display:block;margin:10px 0;user-select:all}
.suggest label{display:block;margin:8px 0 4px;font-weight:600}
nav{justify-content:flex-start;gap:8px}
.burger{order:-1}
#menu{right:auto;left:0;border-left:0;border-right:3px solid var(--accent);transform:translateX(-105%)}
#pause .psp{width:56px;height:56px;border:6px solid #8884;border-top-color:var(--pc,var(--accent));border-radius:50%;animation:r .9s linear infinite;margin:0 auto 20px}
#pause .pspbar{width:220px;max-width:70%;height:8px;border-radius:99px;background:#8883;overflow:hidden;margin:0 auto 22px;position:relative}
#pause .pspbar i{position:absolute;top:0;bottom:0;width:40%;border-radius:99px;background:var(--pc,var(--accent));animation:pb 1.2s ease-in-out infinite}
@keyframes pb{0%{left:-40%}100%{left:100%}}
#pause .pspdots{display:flex;gap:10px;justify-content:center;margin-bottom:22px}
#pause .pspdots i{width:14px;height:14px;border-radius:50%;background:var(--pc,var(--accent));animation:pd 1s infinite}
#pause .pspdots i:nth-child(2){animation-delay:.15s}#pause .pspdots i:nth-child(3){animation-delay:.3s}
@keyframes pd{50%{transform:translateY(-10px);opacity:.4}}
#pause[hidden]{display:none}
.roblox,.chart,.progress{text-align:center}
.pgb{height:16px;background:var(--border);border-radius:99px;overflow:hidden}.pgb div{height:100%;border-radius:99px;transition:width .6s}
#pause{position:fixed;inset:0;z-index:200;background:var(--bg);color:var(--text);display:grid;place-content:center;text-align:center;padding:24px}
.pzt{font-size:.75rem;color:#d62828;font-weight:700;margin-left:auto}
#menu{visibility:hidden;opacity:1;transition:transform var(--ms,.25s),opacity var(--ms,.25s),visibility var(--ms,.25s)}
#menu.mfade{transform:none;opacity:0}
#menu.mzoom{transform:scale(.85);transform-origin:top left;opacity:0}
#menu.mdrop{right:0;width:auto;bottom:auto;max-height:80vh;border:0;border-bottom:3px solid var(--accent);transform:translateY(-105%)}
.mo #menu{visibility:visible;opacity:1;transform:none}
</style>

function field(p,o,k,label,kind,x){const lab=el('label');p.append(lab);let i;
 const upd=()=>{lab.textContent=label+(kind==='range'?' : '+(o[k]??x[3]):kind==='color'&&o[k]==null?' (aucune)':'')};
 if(kind==='area')i=el('textarea');else if(kind==='sel'){i=el('select');x.forEach(([v,l])=>i.append(new Option(l,v)))}
 else{i=el('input');if(kind==='color')i.type='color';if(kind==='num')i.type='number';if(kind==='check')i.type='checkbox';if(kind==='date')i.type='datetime-local';if(kind==='range'){i.type='range';[i.min,i.max,i.step]=x}}
 if(kind==='check')i.checked=!!o[k];else if(kind==='sel')i.value=o[k]??x[0][0];else if(kind==='range')i.value=o[k]??x[3];else if(kind!=='file'||!/^data:/.test(o[k]||''))i.value=o[k]==null?'':o[k];else i.value='(fichier ajouté)';
 i.oninput=()=>{o[k]=kind==='check'?i.checked:(kind==='num'||kind==='range')?+i.value:i.value;upd();save();render()};p.append(i);upd();
 if(kind==='color'&&k!=='accent'){const c=el('button','✕ aucune');c.className='ab g';c.style.cssText='margin-top:6px;padding:5px 10px';c.onclick=()=>{delete o[k];i.value='#000000';upd();save();render()};p.append(c)}
 if(kind==='file'){const f=el('input');f.type='file';f.accept=x;f.onchange=()=>{const fl=f.files[0];if(!fl)return;
  if(fl.size>2e6){toast('Max 2 Mo ici : utilisez un lien');return}
  const r=new FileReader();r.onload=()=>{o[k]=r.result;i.value='(fichier ajouté)';save();render()};r.readAsDataURL(fl)};p.append(f)}}
function editBlock(b){panel('Modifier : '+TL[b.type],p=>{F[b.type].forEach(f=>field(p,b,...f));p.append(el('h4','Style et position'));
 const t=el('p','Astuce : glissez le bouton ✥ du bloc pour le déplacer au doigt.');t.style.cssText='font-size:.85rem;color:var(--muted);margin:4px 0 0';p.append(t);G.forEach(f=>field(p,b,...f))})}
let armed='';
function twice(btn,key,fn){btn.dataset.t=btn.textContent;btn.onclick=()=>{if(armed===key){armed='';fn()}else{armed=key;btn.textContent='Sûr ? Retouchez';setTimeout(()=>{armed='';btn.textContent=btn.dataset.t},3000)}}}
function pages(){panel('Pages',p=>{const ib=(t,f)=>{const b=el('button',t);b.className='ab g';b.style.padding='8px 10px';b.onclick=f;return b};
 S.pages.forEach((pg,i)=>{const r=el('div');r.style.cssText='display:flex;gap:5px;margin-top:8px;align-items:center';
  const inp=el('input');inp.value=pg.name;inp.oninput=()=>{pg.name=inp.value;save();render()};if(i===cur)inp.style.borderColor='var(--accent)';
  const mvp=d=>()=>{const j=i+d;if(j<0||j>=S.pages.length)return;[S.pages[i],S.pages[j]]=[S.pages[j],S.pages[i]];if(cur===i)cur=j;else if(cur===j)cur=i;save();render();pages()};
  const del=ib('🗑',()=>{});twice(del,'d'+i,()=>{if(S.pages.length<2){toast('Gardez au moins une page');return}S.pages.splice(i,1);cur=Math.min(cur,S.pages.length-1);save();render();pages()});
  r.append(inp,ib('👁',()=>{cur=i;render();pages();scrollTo(0,0)}),ib('↑',mvp(-1)),ib('↓',mvp(1)),del);p.append(r)});
 const a=el('button','＋ Nouvelle page');a.className='ab';a.style.marginTop='14px';a.onclick=()=>{S.pages.push({name:'Page '+(S.pages.length+1),blocks:[{id:uid(),type:'heading',text:'Nouvelle page'}]});cur=S.pages.length-1;save();render();pages()};p.append(a)})}
function settings(){panel('Réglages du site',p=>{
 field(p,S,'name','Nom du site');field(p,S,'accent','Couleur principale','color');field(p,S,'bg','Couleur de fond de la page','color');field(p,S,'fg','Couleur du texte de la page','color');
 field(p,S,'zoom','Zoom de la page (%)','range',[50,150,5,100]);field(p,S,'mw','Largeur de la page (px)','range',[360,1400,20,860]);field(p,S,'mh','Hauteur minimale de la page (px, 0 = auto)','num');field(p,S,'pb','Espace ajouté en bas de la page (px) : pour descendre plus loin','range',[0,5000,100,0]);field(p,S,'bg2','Dégradé de fond de page : 2e couleur','color');field(p,S,'ga','Angle du dégradé de page (°)','range',[0,360,15,180]);field(p,S,'don','Lien de don du menu (bouton « Nous soutenir »)');
 p.append(el('h4','Menu ☰'));field(p,S,'ma','Animation d’ouverture','sel',[['','Glisser depuis la gauche'],['fade','Fondu'],['zoom','Zoom'],['drop','Tombe du haut']]);field(p,S,'ms','Vitesse (ms)','range',[100,1000,50,250]);field(p,S,'mc','Couleur du menu','color');field(p,S,'mi','Image en haut du menu : lien ou fichier','file','image/*');
 p.append(el('h4','⏸ Pause du site'));field(p,S,'paused','Mettre le site en pause (visiteurs bloqués)','check');field(p,S,'pt','Titre affiché');field(p,S,'pm','Message affiché','area');field(p,S,'until','Reprise automatique le (optionnel)','date');
 if(S.psp==null)S.psp=true;p.append(el('h4','Apparence de l’écran de pause'));field(p,S,'psp','Afficher l’animation de chargement','check');field(p,S,'pk','Type d’animation','sel',[['','Cercle'],['bar','Barre infinie'],['dots','Points']]);field(p,S,'pc','Couleur de l’animation','color');field(p,S,'pbg','Couleur de fond','color');field(p,S,'pbg2','Dégradé : 2e couleur','color');field(p,S,'pfg','Couleur du texte','color');field(p,S,'pimg','Image (logo) : lien ou fichier','file','image/*');
 const pvz=el('button','Aperçu de l’écran de pause');pvz.className='ab g';pvz.style.marginTop='12px';pvz.onclick=()=>{const z=$('#pause');fillPause(z);z.hidden=false;$('#panel').hidden=true;z.onclick=()=>{z.onclick=null;render()}};p.append(pvz);field(p,S,'foot','Texte du bas de page');
 p.append(el('h4','Écran de chargement'));field(p,S.loader,'on','Activer','check');field(p,S.loader,'text','Texte');field(p,S.loader,'ms','Durée (ms)','num');
 const pv=el('button','Aperçu');pv.className='ab g';pv.style.marginTop='10px';pv.onclick=()=>{p.parentElement.hidden=true;runLoader(true)};p.append(pv);
 const rs=el('button','Tout réinitialiser');rs.className='ab g';rs.style.cssText='display:block;margin-top:18px';twice(rs,'rs',()=>{S=clone(seed);cur=0;save();render();$('#panel').hidden=true});p.append(rs)})}
function runLoader(force){const ld=$('#loader');if(!S.loader.on&&!force){ld.classList.add('gone');return}$('#lt').textContent=S.loader.text;ld.classList.remove('gone');setTimeout(()=>ld.classList.add('gone'),Math.max(300,S.loader.ms))}
function source(){const d=document.documentElement.cloneNode(true);d.removeAttribute('style');
 d.querySelectorAll('body>*').forEach(n=>{if(!['loader','nav','main','foot','fab','bar','panel','menu','scrim','pause','seed','app'].includes(n.id))n.remove()});
 d.querySelectorAll('head>*').forEach(n=>{if(!n.matches('meta[charset],meta[name=viewport],title,style#css,link[rel=stylesheet]'))n.remove()});
 ['nav','main','foot','panel','bar','menu','pause'].forEach(i=>d.querySelector('#'+i).innerHTML='');
 d.querySelector('body').removeAttribute('class');d.querySelector('body').removeAttribute('style');d.querySelector('#loader').removeAttribute('class');d.querySelector('#lt').textContent='';
 d.querySelector('#seed').textContent=JSON.stringify(S).replace(/</g,'\\u003c');
 return '<!DOCTYPE html>\n'+d.outerHTML}
function code(){const html=source();
 panel('Code du site',p=>{p.append(el('p','Copiez ce code dans un fichier index.html. Pour modifier le site, ouvrez-le avec #edit à la fin de l’adresse.'));
 const t=el('textarea');t.readOnly=true;t.value=html;p.append(t);const c=el('button','Copier le code');c.className='ab';c.style.marginTop='10px';
 c.onclick=()=>{t.select();try{navigator.clipboard.writeText(html).then(()=>toast('Code copié'),()=>toast('Sélectionné : copiez-le'))}catch(e){toast('Sélectionné : copiez-le')}};p.append(c)})}
function publish(){S.v=(seed.v||0)+1;edit=false;render();const pn=$('#panel');pn.hidden=true;pn.innerHTML='';const html=source();S.v=seed.v;
 const a=el('a');a.href=URL.createObjectURL(new Blob([html],{type:'text/html'}));a.download='index.html';document.body.append(a);a.click();setTimeout(()=>{a.remove();URL.revokeObjectURL(a.href)},500);
 edit=true;render();toast('index.html téléchargé : envoyez-le sur votre hébergement')}
const bar=$('#bar');
[['⬇ Télécharger le site',publish],['⚙ Réglages',settings],['📄 Pages',pages],['⏸ Pause',()=>{S.paused=!S.paused;save();render();toast(S.paused?'Pause activée : téléchargez le site puis envoyez-le sur votre hébergement':'Pause retirée : téléchargez le site puis envoyez-le sur votre hébergement')}],['</> Code',code],['✓ Terminer',()=>{edit=false;$('#panel').hidden=true;render()}]].forEach(([t,f])=>{const b=el('button',t);b.className='ab'+(t.startsWith('⬇')?'':' g');b.onclick=f;bar.append(b)});
$('#fab').onclick=()=>{edit=true;render()};
render();runLoader();
if(location.hash==='#edit'){CAN=true;try{const r=JSON.parse(localStorage.getItem(K));if(r&&r.v===seed.v)S=r}catch(e){}render()}
addEventListener('hashchange',()=>location.reload());
</script>
